<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Новый студент</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 50px;
        }
        .container {
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin: auto;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        p {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn-container {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        input[type="submit"], input[type="reset"] {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        input[type="submit"] {
            background-color: #28a745;
            color: white;
        }
        input[type="submit"]:hover {
            background-color: #218838;
        }
        input[type="reset"] {
            background-color: #dc3545;
            color: white;
        }
        input[type="reset"]:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Регистрация студента</h1>
    <form action="#" th:action="@{/form}" th:object="${student}" method="post">

        <p>
            <label>ID:</label>
            <input type="text" th:field="*{id}" />
        </p>

        <p>
            <label>Имя:</label>
            <input type="text" placeholder="Введите имя" th:field="*{name}" required />
        </p>

        <p>
            <label>Фамилия:</label>
            <input type="text" placeholder="Введите фамилию" th:field="*{surname}" required />
        </p>

        <p>
            <label>Отчество:</label>
            <input type="text" placeholder="Введите отчество" th:field="*{patronymic}" required />
        </p>

        <p>
            <label>Email:</label>
            <input type="text" placeholder="example@mail.com" th:field="*{email}" required />
        </p>

        <p>
            <label>Год поступления:</label>
            <input type="text" placeholder="2023" th:field="*{admissionYear}" required />
        </p>

        <div class="btn-container">
            <input type="submit" value="Отправить" />
            <input type="reset" value="Сброс" />
        </div>
    </form>
</div>

</body>
</html>
