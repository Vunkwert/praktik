<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Информация о студенте</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e9ecef;
            margin: 0;
            padding: 50px;
        }
        .container {
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin: auto;
        }
        h1 {
            color: #007bff;
            text-align: center;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            font-size: 16px;
        }
        li strong {
            color: #333;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            background-color: #007bff;
            color: white;
            padding: 10px;
            border-radius: 4px;
        }
        .back-link:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Данные студента</h1>
    <ul>
        <li><strong>ID:</strong> <span th:text="${student.id}"></span></li>
        <li><strong>ФИО:</strong> <span th:text="${student.surname + ' ' + student.name + ' ' + student.patronymic}"></span></li>
        <li><strong>Email:</strong> <span th:text="${student.email}"></span></li>
        <li><strong>Год поступления:</strong> <span th:text="${student.admissionYear}"></span></li>
        <li><strong>Группа:</strong> <span th:text="${student.group}"></span></li>
        <li><strong>Логин портала:</strong> <span th:text="${student.login}"></span></li>
    </ul>

    <a class="back-link" href="/form">Ввести новую информацию</a>
</div>

</body>
</html>
