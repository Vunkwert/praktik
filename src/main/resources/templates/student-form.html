<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Форма студента</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>.error-msg { color: red; font-size: 0.85em; }</style>
</head>
<body class="bg-light">
<div class="container my-5">
    <h2>Форма Студента</h2>
    <form th:action="@{/students/save}" th:object="${student}" method="post" class="card p-4 shadow-sm">
        <input type="hidden" th:field="*{id}"/>
        <input type="hidden" th:field="*{address.id}"/>

        <h5>Личные данные</h5>
        <div class="row g-3 mb-3">
            <div class="col-md-4">
                <label class="form-label">Фамилия</label>
                <input type="text" class="form-control" th:field="*{surname}">
                <div class="error-msg" th:if="${#fields.hasErrors('surname')}" th:errors="*{surname}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label">Имя</label>
                <input type="text" class="form-control" th:field="*{name}">
                <div class="error-msg" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label">Отчество</label>
                <input type="text" class="form-control" th:field="*{patronymic}">
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-3">
                <label class="form-label">Пол</label>
                <select class="form-select" th:field="*{gender}">
                    <option value="Мужской">Мужской</option>
                    <option value="Женский">Женский</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Национальность</label>
                <input type="text" class="form-control" th:field="*{nationality}">
                <div class="error-msg" th:if="${#fields.hasErrors('nationality')}" th:errors="*{nationality}"></div>
            </div>
            <div class="col-md-3">
                <label class="form-label">Рост (см)</label>
                <input type="number" step="0.1" class="form-control" th:field="*{height}">
                <div class="error-msg" th:if="${#fields.hasErrors('height')}" th:errors="*{height}"></div>
            </div>
            <div class="col-md-3">
                <label class="form-label">Вес (кг)</label>
                <input type="number" step="0.1" class="form-control" th:field="*{weight}">
                <div class="error-msg" th:if="${#fields.hasErrors('weight')}" th:errors="*{weight}"></div>
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-4">
                <label class="form-label">Дата рождения</label>
                <input type="date" class="form-control" th:field="*{birthDate}">
                <div class="error-msg" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label">Телефон</label>
                <input type="text" class="form-control" th:field="*{phoneNumber}">
                <div class="error-msg" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label">ВУЗ</label>
                <select class="form-select" th:field="*{university.id}">
                    <option th:each="u : ${universities}" th:value="${u.id}" th:text="${u.name}"></option>
                </select>
            </div>
        </div>

        <h5 class="mt-3">Адрес проживания</h5>
        <div class="row g-3 mb-3">
            <div class="col-md-3">
                <label class="form-label">Индекс</label>
                <input type="text" class="form-control" th:field="*{address.postalCode}">
                <div class="error-msg" th:if="${#fields.hasErrors('address.postalCode')}" th:errors="*{address.postalCode}"></div>
            </div>
            <div class="col-md-3">
                <label class="form-label">Страна</label>
                <input type="text" class="form-control" th:field="*{address.country}">
            </div>
            <div class="col-md-3">
                <label class="form-label">Город</label>
                <input type="text" class="form-control" th:field="*{address.city}">
                <div class="error-msg" th:if="${#fields.hasErrors('address.city')}" th:errors="*{address.city}"></div>
            </div>
            <div class="col-md-3">
                <label class="form-label">Улица</label>
                <input type="text" class="form-control" th:field="*{address.street}">
            </div>
        </div>
        <div class="row g-3 mb-3">
            <div class="col-md-3">
                <label class="form-label">Дом</label>
                <input type="text" class="form-control" th:field="*{address.house}">
            </div>
            <div class="col-md-3">
                <label class="form-label">Квартира</label>
                <input type="text" class="form-control" th:field="*{address.apartment}">
            </div>
            <div class="col-md-2">
                <label class="form-label">Курс</label>
                <input type="number" class="form-control" th:field="*{course}">
                <div class="error-msg" th:if="${#fields.hasErrors('course')}" th:errors="*{course}"></div>
            </div>
            <div class="col-md-2">
                <label class="form-label">Группа</label>
                <input type="text" class="form-control" th:field="*{group}">
            </div>
            <div class="col-md-2">
                <label class="form-label">Ср. балл</label>
                <input type="number" step="0.1" class="form-control" th:field="*{averageGrade}">
                <div class="error-msg" th:if="${#fields.hasErrors('averageGrade')}" th:errors="*{averageGrade}"></div>
            </div>
        </div>

        <div>
            <button type="submit" class="btn btn-success">Сохранить</button>
            <a th:href="@{/students}" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>
</body>
</html>
