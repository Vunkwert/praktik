<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Форма студента</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container my-5">
    <h2 th:text="${student.id == null ? 'Добавление студента' : 'Редактирование студента'}"></h2>

    <form th:action="@{/students/save}" th:object="${student}" method="post" class="card p-4 shadow-sm">
        <input type="hidden" th:field="*{id}"/>

        <div class="row g-3 mb-3">
            <div class="col-md-4">
                <label class="form-label">Фамилия</label>
                <input type="text" class="form-control" th:field="*{surname}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Имя</label>
                <input type="text" class="form-control" th:field="*{name}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Отчество</label>
                <input type="text" class="form-control" th:field="*{patronymic}">
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-3">
                <label class="form-label">Пол</label>
                <select class="form-select" th:field="*{gender}">
                    <option value="Мужской">Мужской</option>
                    <option value="Женский">Женский</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Национальность</label>
                <input type="text" class="form-control" th:field="*{nationality}">
            </div>
            <div class="col-md-3">
                <label class="form-label">Дата рождения</label>
                <input type="date" class="form-control" th:field="*{birthDate}">
            </div>
            <div class="col-md-3">
                <label class="form-label">Телефон</label>
                <input type="text" class="form-control" th:field="*{phoneNumber}">
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-3">
                <label class="form-label">Рост (см)</label>
                <input type="number" step="0.1" class="form-control" th:field="*{height}">
            </div>
            <div class="col-md-3">
                <label class="form-label">Вес (кг)</label>
                <input type="number" step="0.1" class="form-control" th:field="*{weight}">
            </div>
            <div class="col-md-6">
                <label class="form-label">ВУЗ</label>
                <input type="text" class="form-control" th:field="*{university}">
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-4">
                <label class="form-label">Специальность</label>
                <input type="text" class="form-control" th:field="*{specialty}">
            </div>
            <div class="col-md-3">
                <label class="form-label">Группа</label>
                <input type="text" class="form-control" th:field="*{group}">
            </div>
            <div class="col-md-2">
                <label class="form-label">Курс</label>
                <input type="number" class="form-control" th:field="*{course}">
            </div>
            <div class="col-md-3">
                <label class="form-label">Средний балл</label>
                <input type="number" step="0.01" class="form-control" th:field="*{averageGrade}">
            </div>
        </div>

        <div>
            <button type="submit" class="btn btn-success">Сохранить</button>
            <a th:href="@{/students}" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>
</body>
</html>
