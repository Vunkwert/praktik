<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список студентов</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Реестр Студентов</h1>
        <a th:href="@{/students/create}" class="btn btn-primary">+ Добавить студента</a>
    </div>

    <div th:if="${#lists.isEmpty(students)}" class="alert alert-info">Список студентов пуст.</div>

    <table th:if="${!#lists.isEmpty(students)}" class="table table-striped table-hover shadow-sm bg-white">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>ФИО</th>
            <th>ВУЗ</th>
            <th>Группа</th>
            <th>Курс</th>
            <th>Ср. балл</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="student : ${students}">
            <td th:text="${student.id}"></td>
            <td th:text="${student.surname + ' ' + student.name + ' ' + student.patronymic}"></td>
            <td th:text="${student.university}"></td>
            <td th:text="${student.group}"></td>
            <td th:text="${student.course}"></td>
            <td th:text="${student.averageGrade}"></td>
            <td>
                <a th:href="@{'/students/details/' + ${student.id}}" class="btn btn-sm btn-info text-white">Детали</a>
                <a th:href="@{'/students/edit/' + ${student.id}}" class="btn btn-sm btn-warning">Редактировать</a>
                <a th:href="@{'/students/delete/' + ${student.id}}"
                   onclick="return confirm('Вы уверены?')" class="btn btn-sm btn-danger">Удалить</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
