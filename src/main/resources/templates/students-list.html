<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список студентов</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Реестр Студентов (ЛБ3)</h1>
        <a th:href="@{/students/create}" class="btn btn-primary">+ Добавить студента</a>
    </div>

    <!-- Панель поиска по 3 комбинациям -->
    <div class="card p-3 mb-4 shadow-sm">
        <h5>Поиск и фильтрация</h5>
        <form th:action="@{/students/search}" method="get" class="row g-2">
            <div class="col-md-3">
                <input type="text" name="surname" class="form-control" placeholder="По фамилии">
            </div>
            <div class="col-md-3">
                <input type="text" name="universityName" class="form-control" placeholder="По названию ВУЗа">
            </div>
            <div class="col-md-3">
                <input type="number" step="0.1" name="minGrade" class="form-control" placeholder="Мин. средний балл">
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn btn-success w-100">Найти</button>
            </div>
        </form>
    </div>

    <table class="table table-striped table-hover shadow-sm bg-white">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>ФИО</th>
            <th>ВУЗ</th>
            <th>Город</th>
            <th>Ср. балл</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="student : ${students}">
            <td th:text="${student.id}"></td>
            <td th:text="${student.surname + ' ' + student.name}"></td>
            <td th:text="${student.university != null ? student.university.name : 'Не указан'}"></td>
            <td th:text="${student.address != null ? student.address.city : 'Не указан'}"></td>
            <td th:text="${student.averageGrade}"></td>
            <td>
                <a th:href="@{'/students/details/' + ${student.id}}" class="btn btn-sm btn-info text-white">Детали</a>
                <a th:href="@{'/students/edit/' + ${student.id}}" class="btn btn-sm btn-warning">Редактировать</a>
                <a th:href="@{'/students/delete/' + ${student.id}}" onclick="return confirm('Удалить?')" class="btn btn-sm btn-danger">Удалить</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
