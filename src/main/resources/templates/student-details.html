<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Карточка студента</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container my-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3>Подробная информация</h3>
        </div>
        <div class="card-body">
            <ul class="list-group list-group-flush">
                <li class="list-group-item"><strong>ФИО:</strong> <span th:text="${student.surname + ' ' + student.name + ' ' + student.patronymic}"></span></li>
                <li class="list-group-item"><strong>ВУЗ:</strong> <span th:text="${student.university != null ? student.university.name : '—'}"></span></li>
                <li class="list-group-item"><strong>Домашний адрес:</strong> <span th:text="${student.address != null ? student.address.fullAddress : '—'}"></span></li>
                <li class="list-group-item"><strong>Индекс:</strong> <span th:text="${student.address != null ? student.address.postalCode : '—'}"></span></li>
                <li class="list-group-item"><strong>Группа / Курс:</strong> <span th:text="${student.group + ' (' + student.course + ' курс)'}"></span></li>
                <li class="list-group-item"><strong>Средний балл:</strong> <span th:text="${student.averageGrade}"></span></li>
                <li class="list-group-item"><strong>Телефон:</strong> <span th:text="${student.phoneNumber}"></span></li>
            </ul>
        </div>
        <div class="card-footer">
            <a th:href="@{/students}" class="btn btn-secondary">Назад</a>
        </div>
    </div>
</div>
</body>
</html>
